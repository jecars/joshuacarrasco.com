baseURL = 'https://www.jecs.me/'
locale = 'en-US'
title = '~'

[module]
  [module.hugoVersion]
    min = '0.169.0'

[security]
  # Org content is authored in this repository; keep raw HTML content disabled.
  allowContent = ['! ^text/html$']

[params]
  mainSections = ['posts', 'experience']

  [[params.author]]
    name = "Joshua Carrasco Sousa"
    email = "mail@jecs.me"

[taxonomies]
  tag = 'tags'

[menus]
  [[menus.nav]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 1
  # pre denotes the icon from https://feathericons.com/
  # see layouts/_partials/header.html
  pre = "home"

  [[menus.nav]]
  identifier = "posts"
  name = "Posts"
  url = "/posts"
  weight = 2
  pre = "book"

  [[menus.nav]]
  identifier = "tags"
  name = "Tags"
  url = "/tags"
  weight = 3
  pre = "tag"

  [[menus.nav]]
  identifier = "rss"
  name = "RSS"
  url = "/posts/index.xml"
  weight = 5
  pre = "rss"


[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noHl = false
    noClasses = false # override style with static/css/syntax.css
    style = 'xcode'
    tabWidth = 4
